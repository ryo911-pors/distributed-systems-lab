

# 注意: 3つのコンテナは同じ MacBook のメモリ/ディスク/CPU を共有している。
#       本物の3台構成ではない。ネットワークとプロトコルは本物。

services:
  leader:
    image: postgres:17
    container_name: ddia-leader
    environment:
      POSTGRES_PASSWORD: ddia
      REPL_PASSWORD: replpass
    ports:
      - "15432:5432"   # Mac側は15432（5432はMacのネイティブPostgreSQLが使用中）         
    volumes:
      - ./leader/init-replication.sh:/docker-entrypoint-initdb.d/init-replication.sh:ro
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on 
      -c synchronous_commit=on
      -c synchronous_standby_names=''
      -c log_replication_commands=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  follower1:
    image: postgres:17
    container_name: ddia-follower1
    hostname: follower1              # pg_stat_replication.application_name に出る名前
    environment:
      PGDATA: /var/lib/postgresql/data
      REPL_PASSWORD: replpass
    ports:
      - "15433:5432"       
    volumes:
      - ./follower/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    user: postgres         
    depends_on:
      leader:
        condition: service_healthy
  follower2:
    image: postgres:17
    container_name: ddia-follower2
    hostname: follower2              # pg_stat_replication.application_name に出る名前
    environment:
      PGDATA: /var/lib/postgresql/data
      REPL_PASSWORD: replpass
    ports:
      - "15434:5432"       
    volumes:
      - ./follower/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    user: postgres         
    depends_on:
      leader:
        condition: service_healthy
